<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Infrastructure Unwinding Monitor - Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        :root {
            /* Dark Glassmorphism Analytics Theme */
            /* Backgrounds */
            --bg-primary: #0A1628;              /* Deep navy background */
            --bg-secondary: #0D1F3C;            /* Slightly lighter navy */
            --bg-card: rgba(15, 30, 60, 0.6);   /* Semi-transparent dark blue cards */
            --bg-card-alt: rgba(20, 35, 70, 0.7); /* Alt card with more opacity */
            --bg-hover: rgba(0, 102, 255, 0.15);  /* Blue hover overlay */

            /* Text */
            --text-primary: #FFFFFF;            /* Pure white for primary text */
            --text-secondary: #3D9FFF;          /* Electric blue for highlights */
            --text-tertiary: #7BA3C4;           /* Muted blue-gray for supporting text */
            --text-data: #FFFFFF;               /* White for data/metrics */

            /* Accents */
            --accent-positive: #10B981;         /* Vibrant emerald green (positive/green status) */
            --accent-negative: #FF4757;         /* Soft red (alerts) */
            --accent-warning: #FFA502;          /* Warm orange (warnings) */
            --accent-info: #3D9FFF;             /* Info blue (links) */

            /* Chart colors */
            --chart-blue1: #0066FF;
            --chart-blue2: #3D9FFF;
            --chart-blue3: #66B3FF;
            --chart-blue4: #99CCFF;
            --chart-accent1: #1E90FF;
            --chart-accent2: #4169E1;

            /* Shadows & Glows (Blue-tinted) */
            --shadow-glow: 0 8px 32px rgba(0, 102, 255, 0.3);
            --shadow-card: 0 4px 20px rgba(0, 102, 255, 0.2);
            --shadow-hover: 0 12px 40px rgba(0, 102, 255, 0.4);

            /* Spacing */
            --gap: 24px;
            --card-padding: 32px;
            --border-radius: 20px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            padding: 0;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Subtle dark grid background pattern */
        body::before {
            content: '';
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background-image: radial-gradient(circle at center, rgba(0, 102, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            pointer-events: none;
            z-index: 0;
            opacity: 0.5;
        }


        /* Container */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: var(--gap);
            position: relative;
            z-index: 1;
        }

        /* V4.0 Grid-Based Layout */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: var(--gap);
            margin-bottom: var(--gap);
        }

        /* Card Base Styles - Glassmorphism */
        .card {
            background: var(--bg-card);                    /* Semi-transparent */
            backdrop-filter: blur(10px);                   /* Glassmorphism blur */
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 102, 255, 0.1);     /* Subtle blue border */
            border-radius: var(--border-radius);
            padding: var(--card-padding);
            box-shadow: var(--shadow-card);                /* Blue glow */
            transition: all 0.3s ease;
            position: relative;
            animation: smoothFadeIn 0.6s ease-out;
        }

        .card:hover {
            transform: translateY(-4px);                   /* Gentle lift */
            box-shadow: var(--shadow-hover);               /* Enhanced glow */
            border-color: rgba(0, 102, 255, 0.25);         /* Brighter border */
            background: var(--bg-card-alt);                /* Slightly more opaque */
        }

        @keyframes smoothFadeIn {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .card--wide {
            grid-column: span 2;
        }

        /* V4.0 Metric Card (Compact) */
        .metric-card {
            grid-column: span 1;
        }

        .info-icon {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid var(--text-tertiary);
            color: var(--text-tertiary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .info-icon:hover {
            border-color: var(--accent-info);
            color: var(--accent-info);
        }

        .metric-value {
            font-size: 3.5rem;
            font-weight: 700;
            color: var(--text-data);          /* White */
            line-height: 1;
            margin: 20px 0;
            text-shadow: 0 0 20px rgba(0, 102, 255, 0.3); /* Blue glow */
            letter-spacing: -0.02em;
            animation: smoothScale 0.6s ease-out;
        }

        @keyframes smoothScale {
            from {
                transform: scale(0.95);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .metric-badge {
            display: inline-block;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            background: rgba(16, 185, 129, 0.25);         /* Emerald green */
            border: 1px solid rgba(16, 185, 129, 0.5);
            color: #10B981;
            box-shadow: 0 4px 16px rgba(16, 185, 129, 0.3); /* Green glow */
            text-transform: uppercase;
            letter-spacing: 0.3px;
            margin: 12px 0;
        }

        .metric-badge.negative {
            background: rgba(255, 165, 0, 0.15);          /* Soft orange */
            border-color: rgba(255, 165, 0, 0.3);
            color: #FFB366;                               /* Light peachy orange */
            box-shadow: 0 4px 12px rgba(255, 165, 0, 0.15);
        }

        .metric-description {
            font-size: 0.8125rem;
            color: var(--text-secondary);
            margin-top: 12px;
        }

        .metric-link {
            color: var(--accent-info);
            font-size: 0.8125rem;
            text-decoration: none;
            margin-top: 8px;
            display: inline-block;
        }

        .metric-link:hover {
            text-decoration: underline;
        }

        /* V4.0 Chart Card (Wide) */
        .chart-card {
            grid-column: span 2;
        }

        .card-title {
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chart-container {
            position: relative;
            height: 300px;
        }

        /* V4.0 Info Icon Popover System */
        .popover {
            position: absolute;
            z-index: 1000;
            background: #2a2d31;
            border: 1px solid var(--border-medium);
            border-radius: var(--border-radius);
            padding: 20px;
            box-shadow: var(--shadow-lg);
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            top: 40px;
            right: 0;
        }

        .info-icon:hover + .popover,
        .popover:hover {
            opacity: 1;
            pointer-events: auto;
        }

        .popover-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 12px;
        }

        .popover-description {
            font-size: 0.875rem;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 12px;
        }

        .popover-meta {
            font-size: 0.75rem;
            color: var(--text-tertiary);
            border-top: 1px solid var(--border-subtle);
            padding-top: 12px;
            margin-top: 12px;
        }

        .popover-meta div {
            margin-bottom: 4px;
        }

        /* Mobile backdrop for popovers */
        @media (hover: none) {
            .popover-backdrop {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: rgba(0,0,0,0.3);
                z-index: 999;
                display: none;
            }

            .popover-backdrop.active {
                display: block;
            }

            .info-icon.active + .popover {
                opacity: 1;
                pointer-events: auto;
            }
        }

        /* Status Badges - Dark Glassmorphism */
        .status-badge {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 16px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            white-space: nowrap;
            border: 1px solid;
            margin: 4px 4px 4px 0;
            vertical-align: middle;
        }

        .status-badge.green {
            background: rgba(16, 185, 129, 0.2);
            border-color: var(--accent-positive);
            color: var(--accent-positive);
            box-shadow: 0 2px 8px rgba(16, 185, 129, 0.2);
        }

        .status-badge.yellow {
            background: linear-gradient(135deg, rgba(212, 165, 116, 0.12), rgba(212, 165, 116, 0.08));
            border-color: var(--accent-warning);
            color: var(--accent-warning);
        }

        .status-badge.red {
            background: rgba(255, 71, 87, 0.15);
            border-color: var(--accent-negative);
            color: var(--accent-negative);
            box-shadow: 0 2px 8px rgba(255, 71, 87, 0.15);
        }

        /* Section Styles */
        .section {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--border-radius);
            padding: var(--card-padding);
            box-shadow: var(--shadow-sm);
            margin-bottom: var(--gap);
        }

        .section h2 {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 20px;
        }

        /* Company Cards - Dense Grid */
        .company-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 16px;
        }

        .company-card {
            background: var(--bg-card-alt);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            padding: 16px;
        }

        .company-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .company-name {
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .metric-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            font-size: 0.8125rem;
        }

        .metric-label {
            color: var(--text-tertiary);
        }

        .metric-value-text {
            font-weight: 500;
            color: var(--text-primary);
        }

        /* Signal Cards */
        .signals-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 16px;
        }

        .signal-card {
            background: var(--bg-card-alt);
            border-left: 3px solid var(--accent-warning);
            border-radius: 8px;
            padding: 16px;
        }

        .signal-card.positive {
            border-left-color: var(--accent-positive);
        }

        .signal-card.moderate {
            border-left-color: var(--accent-warning);
        }

        .signal-card.critical {
            border-left-color: var(--accent-negative);
        }

        .signal-card h4 {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .signal-card p {
            font-size: 0.875rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        /* Tab/Mode Toggle */
        .mode-toggle {
            display: flex;
            justify-content: center;
            gap: 0;
            margin: 20px 0;
            border-radius: 8px;
            overflow: hidden;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
        }

        .toggle-btn {
            padding: 10px 28px;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .toggle-btn:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .toggle-btn.active {
            background: var(--accent-info);
            color: #fff;
            font-weight: 600;
        }

        /* Dashboard Views */
        .dashboard-view {
            display: none;
        }

        .dashboard-view.active {
            display: block;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 32px 20px;
            color: var(--text-tertiary);
            font-size: 0.8125rem;
        }

        /* Responsive - Tablet */
        @media (max-width: 1023px) {
            .dashboard-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .card--wide {
                grid-column: span 2;
            }
        }

        /* Responsive - Mobile */
        @media (max-width: 767px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }

            .card--wide {
                grid-column: span 1;
            }

            .metric-value {
                font-size: 3rem;
            }

            .chart-container {
                height: 250px;
            }

            .company-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Accessibility - Keyboard Focus */
        .info-icon:focus,
        .toggle-btn:focus {
            outline: 2px solid var(--accent-info);
            outline-offset: 2px;
        }
    </style>
</head>
<body>
    
    <nav class="mode-toggle" style="margin-top: 20px;">
        <button class="toggle-btn" data-mode="lagging">Lagging Indicators</button>
        <button class="toggle-btn active" data-mode="leading">Leading Indicators</button>
    </nav>
    

    <div class="container">
        <!-- Lagging Indicators View (rendered from data/tracking_data.json by app.js) -->
        <div class="dashboard-view " id="lagging-view"></div>

        <!-- Leading Indicators View (rendered from data/tracking_data_leading.json by app.js) -->
        <div class="dashboard-view active" id="leading-view"></div>

        <footer>
            <p>AI Infrastructure Unwinding Monitor | Last Updated: <span id="footer-updated">—</span></p>
            <p>Data sources: SEC filings, earnings calls, public reports</p>
            <p>For educational and research purposes only. Not investment advice.</p>
        </footer>
    </div>

    <script defer src="./app.js"></script>
</body>
</html>
